name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests beautifulsoup4 pytz
          python3 -c '
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import pytz
          import json
          import re

          target_stations = ["C.2", "C.13", "C.7A", "C.36", "C.46", "C.47"]
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          
          scraped_data = {}

          try:
              url = "http://hyd-app-db.rid.go.th/hydro5h.html"
              response = requests.get(url, timeout=15)
              response.encoding = "utf-8"
              soup = BeautifulSoup(response.text, "html.parser")
              
              # ค้นหาตารางทั้งหมดในหน้าเว็บเพื่อกวาดข้อมูลสถานีจริง
              for tr in soup.find_all("tr"):
                  text = tr.get_text()
                  for st in target_stations:
                      if st in text and st not in scraped_data:
                          tds = tr.find_all(["td", "th"])
                          nums = []
                          for td in tds:
                              found = re.findall(r"\d+\.\d+", td.get_text())
                              if found:
                                  nums.extend([float(x) for x in found])
                          if nums:
                              if st == "C.13":
                                  scraped_data[st] = {
                                      "wl_up": nums[0] if len(nums) > 0 else 0.0,
                                      "wl_down": nums[1] if len(nums) > 1 else 0.0,
                                      "flow": nums[-1] if len(nums) > 2 else 0.0
                                  }
                              else:
                                  scraped_data[st] = {
                                      "wl": nums[0] if len(nums) > 0 else 0.0,
                                      "flow": nums[-1] if len(nums) > 1 else 0.0
                                  }
          except Exception as e:
              print("Error fetching web: ", e)

          final_list = []
          for st in target_stations:
              info = scraped_data.get(st, {})
              entry = {
                  "timestamp": now,
                  "station": st,
                  "flow": info.get("flow", 0.0)
              }
              if st == "C.13":
                  entry["water_level_up"] = info.get("wl_up", 0.0)
                  entry["water_level_down"] = info.get("wl_down", 0.0)
              else:
                  entry["water_level"] = info.get("wl", 0.0)
              final_list.append(entry)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(final_list, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
