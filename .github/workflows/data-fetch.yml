name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests pytz
          python3 -c '
          import requests
          from datetime import datetime
          import pytz
          import json

          # ใช้ Endpoint สำหรับดึงรายงานสถานการณ์น้ำรายชั่วโมงของกรมชลฯ
          url = "https://hyd-app-db.rid.go.th/webservice/getGroupHourlyWaterLevelReportAllHL5.ashx"
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          
          target_stations = ["C.2", "C.13", "C.7A", "C.36", "C.46", "C.47"]
          station_data_map = {}

          try:
              headers = {
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "User-Agent": "Mozilla/5.0"
              }
              response = requests.post(url, headers=headers, data={}, timeout=15)
              data = response.json()
              
              rows = data if isinstance(data, list) else data.get("rows", data.get("d", []))

              for row in rows:
                  row_upper = {str(k).upper(): v for k, v in row.items()}
                  st_name = str(row_upper.get("STATION", row_upper.get("STN_CODE", ""))).strip()
                  
                  if st_name in target_stations:
                      station_data_map[st_name] = {
                          "water_level": float(row_upper.get("WL", row_upper.get("WATERLEVEL", 0.0)) or 0.0),
                          "water_level_up": float(row_upper.get("WL_UP", row_upper.get("WATERLEVEL_UP", 0.0)) or 0.0),
                          "water_level_down": float(row_upper.get("WL_DOWN", row_upper.get("WATERLEVEL_DOWN", 0.0)) or 0.0),
                          "flow": float(row_upper.get("Q", row_upper.get("FLOW", 0.0)) or 0.0)
                      }
          except Exception as e:
              print("Error fetching main API: ", e)

          # จัดเรียงชุดข้อมูลตามลำดับสถานีเป้าหมาย
          final_list = []
          for st in target_stations:
              vals = station_data_map.get(st, {
                  "water_level": 0.0,
                  "water_level_up": 0.0,
                  "water_level_down": 0.0,
                  "flow": 0.0
              })
              final_list.append({
                  "timestamp": now,
                  "station": st,
                  "water_level": vals["water_level"],
                  "water_level_up": vals["water_level_up"],
                  "water_level_down": vals["water_level_down"],
                  "flow": vals["flow"]
              })

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(final_list, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
