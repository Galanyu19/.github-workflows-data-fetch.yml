name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests pytz
          python3 -c '
          import requests
          from datetime import datetime
          import pytz
          import json

          url = "https://hyd-app-db.rid.go.th/webservice/getGroupHourlyWaterLevelReportAllHL5.ashx"
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          
          final_list = []

          try:
              response = requests.post(url, timeout=15)
              data = response.json()
              rows = data.get("rows", [])
              
              if rows:
                  # วนลูปเช็คทุกแถวข้อมูลใน API เพื่อดึงสถานีที่เราสนใจ
                  for row in rows:
                      # ตรวจสอบชื่อฟิลด์ที่เป็นรหัสสถานี (มักจะเก็บใน key เช่น station, Station, StName หรือ cell แรกๆ)
                      # ลองดึงทุก key มาเทียบพิมพ์ใหญ่-เล็ก
                      row_upper = {str(k).upper(): v for k, v in row.items()}
                      
                      st_name = str(row_upper.get("STATION", row_upper.get("STN_CODE", ""))).strip()
                      
                      if st_name in ["C.2", "C.13", "C.7A", "C.36", "C.46", "C.47"]:
                          # ดึงค่าระดับน้ำและปริมาณน้ำจากคีย์ที่มักใช้ในระบบชลประทาน
                          wl = float(row_upper.get("WL", row_upper.get("WATERLEVEL", row_upper.get("H", 0.0))) or 0.0)
                          wl_up = float(row_upper.get("WL_UP", row_upper.get("WATERLEVEL_UP", 0.0)) or 0.0)
                          wl_down = float(row_upper.get("WL_DOWN", row_upper.get("WATERLEVEL_DOWN", 0.0)) or 0.0)
                          flow = float(row_upper.get("Q", row_upper.get("FLOW", 0.0)) or 0.0)
                          
                          entry = {
                              "timestamp": now,
                              "station": st_name,
                              "water_level": wl,
                              "water_level_up": wl_up,
                              "water_level_down": wl_down,
                              "flow": flow
                          }
                          final_list.append(entry)
          except Exception as e:
              print("Error: ", e)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(final_list, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
