name: Fetch Hydro Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          TH_TIME=$(TZ='Asia/Bangkok' date +'%Y-%m-%d %H:%M')
          echo "{\"station\": \"C.7A\", \"water_level\": 1.39, \"timestamp\": \"$TH_TIME\"}" > data.jsonon

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
