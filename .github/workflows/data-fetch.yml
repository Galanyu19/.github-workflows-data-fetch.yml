name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests beautifulsoup4 pytz
          python3 -c '
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import pytz
          import json
          import re

          target_stations = ["C.2", "C.13", "C.7A", "C.36", "C.46", "C.47"]
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          data_list = {}

          try:
              url = "http://water.rid.go.th/hydro5/mainframe.htm"
              response = requests.get(url, timeout=15)
              response.encoding = "tis-620"
              soup = BeautifulSoup(response.text, "html.parser")
              
              # ค้นหาตารางทั้งหมดในหน้าเว็บ
              tables = soup.find_all("table")
              for table in tables:
                  rows = table.find_all("tr")
                  for row in rows:
                      cols = row.find_all(["td", "th"])
                      cols_text = [col.text.strip() for col in cols]
                      
                      # วนหาชื่อสถานีในตาราง
                      for st in target_stations:
                          for text in cols_text:
                              if st in text:
                                  # พยายามดึงตัวเลขจากแถวเดียวกัน
                                  numbers = []
                                  for col in cols_text:
                                      # ค้นหาตัวเลขทศนิยม
                                      found = re.findall(r"\d+\.\d+", col)
                                      if found:
                                          numbers.extend([float(x) for x in found])
                                  
                                  if numbers:
                                      if st == "C.13" and len(numbers) >= 2:
                                          data_list[st] = {"wl_up": numbers[0], "wl_down": numbers[1], "flow": numbers[-1] if len(numbers) > 2 else 0.0}
                                      else:
                                          data_list[st] = {"wl": numbers[0], "flow": numbers[-1] if len(numbers) > 1 else 0.0}
          except Exception as e:
              print("Error scraping: ", e)

          # จัดรูปแบบข้อมูลเตรียมส่งออก
          final_data = []
          for st in target_stations:
              info = data_list.get(st, {})
              entry = {
                  "timestamp": now,
                  "station": st,
                  "flow": info.get("flow", 0.0)
              }
              if st == "C.13":
                  entry["water_level_up"] = info.get("wl_up", 0.0)
                  entry["water_level_down"] = info.get("wl_down", 0.0)
              else:
                  entry["water_level"] = info.get("wl", 0.0)
              final_data.append(entry)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(final_data, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
