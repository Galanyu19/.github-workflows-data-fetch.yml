name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests pytz
          python3 -c '
          import requests
          from datetime import datetime
          import pytz
          import json

          url = "https://hyd-app-db.rid.go.th/webservice/getGroupHourlyWaterLevelReportAllHL5.ashx"
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          
          final_list = []

          try:
              headers = {
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "User-Agent": "Mozilla/5.0"
              }
              response = requests.post(url, headers=headers, data={}, timeout=15)
              data = response.json()
              
              rows = []
              if isinstance(data, list):
                  rows = data
              elif isinstance(data, dict):
                  rows = data.get("rows", data.get("d", []))

              if rows:
                  # ปริ้นท์โครงสร้างคีย์ของแถวแรกสุดออกมาดูใน GitHub Actions Log เพื่อความโปร่งใส
                  print("--- SAMPLE KEYS FROM RID API ---")
                  print(list(rows[0].keys()))
                  print("--------------------------------")

                  for row in rows:
                      # บันทึกข้อมูลดิบทั้งหมดจาก API ลงไปตรงๆ เพื่อให้คุณเลือกใช้คีย์ได้ถูกต้องแม่นยำที่สุด
                      entry = {
                          "timestamp": now,
                          "raw_data": row
                      }
                      final_list.append(entry)
          except Exception as e:
              print("Error fetching API: ", e)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(final_list, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
