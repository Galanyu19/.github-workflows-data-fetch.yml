name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests pytz
          python3 -c '
          import requests
          from datetime import datetime
          import pytz
          import json

          url = "https://hyd-app-db.rid.go.th/webservice/getGroupHourlyWaterLevelReportAllHL5.ashx"
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          
          final_list = []

          try:
              # ส่ง Request แบบ POST พร้อม Headers จำลองการเข้าใช้งานจากเบราว์เซอร์
              headers = {
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              }
              response = requests.post(url, headers=headers, data={}, timeout=15)
              data = response.json()
              
              # ตรวจสอบรูปแบบข้อมูลที่ได้กลับมา
              rows = []
              if isinstance(data, list):
                  rows = data
              elif isinstance(data, dict):
                  rows = data.get("rows", data.get("d", []))

              print(f"Total rows fetched: {len(rows)}")

              if rows:
                  for row in rows:
                      # แปลงคีย์ทั้งหมดเป็นตัวพิมพ์ใหญ่เพื่อให้อ่านง่าย
                      row_upper = {str(k).upper(): v for k, v in row.items()}
                      
                      # ค้นหารหัสสถานีจากฟิลด์ที่เป็นไปได้
                      st_name = str(row_upper.get("STATION", row_upper.get("STN_CODE", row_upper.get("STATION_NAME", "")))).strip()
                      
                      if any(target in st_name for target in ["C.2", "C.13", "C.7A", "C.36", "C.46", "C.47"]):
                          # ดึงค่าระดับน้ำและปริมาณน้ำ
                          wl = float(row_upper.get("WL", row_upper.get("WATERLEVEL", row_upper.get("H", 0.0))) or 0.0)
                          wl_up = float(row_upper.get("WL_UP", row_upper.get("WATERLEVEL_UP", 0.0)) or 0.0)
                          wl_down = float(row_upper.get("WL_DOWN", row_upper.get("WATERLEVEL_DOWN", 0.0)) or 0.0)
                          flow = float(row_upper.get("Q", row_upper.get("FLOW", 0.0)) or 0.0)
                          
                          entry = {
                              "timestamp": now,
                              "station": st_name,
                              "water_level": wl,
                              "water_level_up": wl_up,
                              "water_level_down": wl_down,
                              "flow": flow
                          }
                          final_list.append(entry)

          except Exception as e:
              print("Error fetching API: ", e)

          # หากดึงผ่าน API ตรงไม่ได้หรือไม่ได้ข้อมูล ให้ใส่โครงสร้างตัวอย่างเผื่อไม่ให้พัง แต่รอบนี้จะดึงจากโครงสร้างจริง
          if not final_list:
              print("Warning: No matching rows found, writing empty defaults.")

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(final_list, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
