name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests beautifulsoup4 pytz
          python3 -c '
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import pytz
          import json

          # รายชื่อสถานีและตำแหน่งคอลัมน์/รหัสที่ปรากฏในตารางเว็บจริง
          target_stations = ["C.2", "C.13", "C.3", "C.45", "C.46", "C.7A"] 
          # หมายเหตุ: ปรับรายชื่อสถานีตามที่คุณต้องการเก็บจริง (C.2, C.13, C.7A, C.46 และอื่นๆ ในตาราง)
          
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          extracted_data = {}

          try:
              url = "http://hyd-app-db.rid.go.th/hydro5h.html"
              response = requests.get(url, timeout=15)
              response.encoding = "utf-8"
              soup = BeautifulSoup(response.text, "html.parser")
              
              # ค้นหาตารางทั้งหมด
              tables = soup.find_all("table")
              for table in tables:
                  rows = table.find_all("tr")
                  if len(rows) > 5: # เช็คว่าเป็นตารางข้อมูลหลัก
                      # ดึงแถวสุดท้ายของตาราง (ซึ่งคือชั่วโมงล่าสุดที่มีการบันทึก)
                      latest_row = rows[-1] 
                      cols = [td.get_text(strip=True) for td in latest_row.find_all(["td", "th"])]
                      
                      # เนื่องจากตารางนี้มีหัวข้อสถานีอยู่ด้านบน เราจะดึงข้อมูลตามโครงสร้างตาราง HTML นี้
                      # เพื่อความชัวร์ เราเขียนดึงค่าทั้งหมดจากตารางมาแมป
          except Exception as e:
              print("Error fetching URL: ", e)

          # วิธีที่เสถียรที่สุดสำหรับหน้าเว็บนี้: ดึงข้อมูลผ่านโครงสร้างตารางจริง
          # หรือถ้าต้องการดึงค่าล่าสุดแบบแม่นยำ เดี๋ยวผมเขียนตัวแกะรหัสแถวสุดท้ายให้ครับ
          '
