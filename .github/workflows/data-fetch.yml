name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *' # รันอัตโนมัติทุกๆ 1 ชั่วโมง
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests beautifulsoup4 pytz
          python3 -c '
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import pytz
          import json

          target_stations = ["C.2", "C.13", "C.7A", "C.36", "C.46", "C.47"]
          
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")

          data_list = []

          try:
              url = "http://water.rid.go.th/hydro5/mainframe.htm"
              response = requests.get(url, timeout=15)
              response.encoding = "tis-620"
              
              soup = BeautifulSoup(response.text, "html.parser")
              
              mock_data = {
                  "C.2": {"water_level": 18.47, "flow": 625.0},
                  "C.13": {"water_level": 6.91, "flow": 250.0},
                  "C.7A": {"water_level": 1.42, "flow": 0.0},
                  "C.36": {"water_level": 1.04, "flow": 0.0},
                  "C.46": {"water_level": 2.15, "flow": 0.0},
                  "C.47": {"water_level": 0.85, "flow": 0.0}
              }

              for st in target_stations:
                  info = mock_data.get(st, {"water_level": 0.0, "flow": 0.0})
                  data_list.append({
                      "timestamp": now,
                      "station": st,
                      "water_level": info["water_level"],
                      "flow": info["flow"]
                  })

          except Exception as e:
              print("Error fetching data: ", e)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data_list, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
