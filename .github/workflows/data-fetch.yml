name: Fetch Hydro Stations Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Process Data
        run: |
          pip install requests pytz
          python3 -c '
          import requests
          from datetime import datetime
          import pytz
          import json

          url = "https://hyd-app-db.rid.go.th/webservice/getGroupHourlyWaterLevelReportAllHL5.ashx"
          tz = pytz.timezone("Asia/Bangkok")
          now = datetime.now(tz).strftime("%Y-%m-%d %H:%M")
          
          target_stations = {
              "C.2": {"col_wl": "C2_WL", "col_flow": "C2_Q"},
              "C.13": {"col_wl_up": "C13_UP", "col_wl_down": "C13_DOWN", "col_flow": "C13_Q"},
              "C.7A": {"col_wl": "C7A_WL", "col_flow": "C7A_Q"},
              "C.36": {"col_wl": "C36_WL", "col_flow": "C36_Q"},
              "C.46": {"col_wl": "C46_WL", "col_flow": "C46_Q"},
              "C.47": {"col_wl": "C47_WL", "col_flow": "C47_Q"}
          }

          final_list = []

          try:
              headers = {"User-Agent": "Mozilla/5.0"}
              # เนื่องจาก API นี้เป็น POST อาจจะต้องส่ง Payload ไปด้วย ลองใช้ requests.post ถ้าจำเป็น
              response = requests.post(url, headers=headers, timeout=15)
              data = response.json()
              
              rows = data.get("rows", [])
              if rows:
                  # เอาแถวสุดท้าย (ชั่วโมงล่าสุด)
                  latest = rows[-1]
                  
                  for st, keys in target_stations.items():
                      entry = {
                          "timestamp": now,
                          "station": st
                      }
                      if st == "C.13":
                          entry["water_level_up"] = float(latest.get(keys["col_wl_up"], 0.0) or 0.0)
                          entry["water_level_down"] = float(latest.get(keys["col_wl_down"], 0.0) or 0.0)
                          entry["flow"] = float(latest.get(keys["col_flow"], 0.0) or 0.0)
                      else:
                          entry["water_level"] = float(latest.get(keys["col_wl"], 0.0) or 0.0)
                          entry["flow"] = float(latest.get(keys["col_flow"], 0.0) or 0.0)
                      final_list.append(entry)
          except Exception as e:
              print("Error fetching API: ", e)
              # ถ้าดึงพลาด ให้สร้างค่าโครงสร้างเดิมป้องกันเว็บพัง
              for st in target_stations:
                  final_list.append({"timestamp": now, "station": st, "flow": 0.0, "water_level": 0.0})

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(final_list, f, ensure_ascii=False, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
